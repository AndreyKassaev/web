<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог Фильмов</title>

</head>

<body>

    <h1>🎬 Каталог фильмов</h1>

    <!-- Блок управления для демонстрации работы функций -->
    <div class="controls">
        <button onclick="showSortedNames()">1. Показать только названия (А-Я)</button>
        <button onclick="filterByGenreDemo('Фантастика')">2. Жанр: Фантастика</button>
        <button onclick="filterByYearDemo(2010)">3. Год: после 2010</button>
        <button onclick="filterByDirectorDemo('Кристофер Нолан')">4. Режиссер: К. Нолан</button>
        <button class="reset" onclick="renderTable(movies)">Сбросить фильтры</button>
    </div>

    <!-- Вьюха в виде таблицы -->
    <div class="table-container">
        <table id="moviesTable">
            <thead>
                <tr id="tableHeader">
                    <th>Название</th>
                    <th>Жанр</th>
                    <th>Режиссер</th>
                    <th>Год выпуска</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Данные вставляются через JS -->
            </tbody>
        </table>
    </div>

</body>

</html>
